# Release pipeline: test the exact tagged commit, then publish assets.
# Actions are pinned to full commit SHAs (see CI workflow for the same pins).

name: Release

on:
  push:
    tags:
      - "v*"

# Default deny write; only the publish job elevates.
permissions:
  contents: read

jobs:
  quality:
    name: Quality gate (tagged commit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Verify tag points at checked-out commit
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          CHECKOUT="$(git rev-parse HEAD)"
          TAGGED="$(git rev-parse "${TAG}^{commit}")"
          echo "checkout=${CHECKOUT}"
          echo "tag=${TAG} → ${TAGGED}"
          if [ "$CHECKOUT" != "$TAGGED" ]; then
            echo "Checked-out commit does not match tag ${TAG}" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node (JS syntax + Vitest)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install -U pip
          pip install -e ".[dev]" -c constraints.txt
          npm ci

      - name: Run quality gate
        run: |
          set -euo pipefail
          chmod +x scripts/ci.sh
          ./scripts/ci.sh

  dependency-audit:
    name: Dependency audit (pip-audit / OSV)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install and audit
        run: |
          set -euo pipefail
          python -m pip install -U pip
          pip install -e ".[dev]" -c constraints.txt
          npm ci
          chmod +x scripts/dependency-audit.sh
          ./scripts/dependency-audit.sh

  release:
    name: Publish release
    needs: [quality, dependency-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history so the tag resolves cleanly and git archive sees every path.
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Verify tag points at checked-out commit
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          CHECKOUT="$(git rev-parse HEAD)"
          TAGGED="$(git rev-parse "${TAG}^{commit}")"
          echo "checkout=${CHECKOUT}"
          echo "tag=${TAG} → ${TAGGED}"
          if [ "$CHECKOUT" != "$TAGGED" ]; then
            echo "Checked-out commit does not match tag ${TAG}" >&2
            exit 1
          fi
          git log -1 --oneline HEAD
          echo "Tracked files: $(git ls-tree -r --name-only HEAD | wc -l)"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build release assets
        run: |
          set -euo pipefail
          chmod +x scripts/make-release-assets.sh
          ./scripts/make-release-assets.sh "${GITHUB_REF_NAME}"
          # Confirm the packed commit matches this tag.
          grep -F "commit=$(git rev-parse HEAD)" dist/stage/paperlessagent-*/.release-commit
          # Sanity: archive must contain every currently tracked path we care about.
          tar -tzf dist/paperlessagent-*.tar.gz | grep -E 'paperless_agent/system_service\.py$'
          tar -tzf dist/paperlessagent-*.tar.gz | grep -E 'app/static/app\.js$'
          tar -tzf dist/paperlessagent-*.tar.gz | grep -E '\.release-commit$'
          tar -tzf dist/paperlessagent-*.tar.gz | grep -E '\.release-files$'
          cat dist/stage/paperlessagent-*/.release-commit

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          COMMIT="$(git rev-parse HEAD)"
          COMMIT_SHORT="$(git rev-parse --short=12 HEAD)"
          FILE_COUNT="$(git ls-tree -r --name-only HEAD | wc -l | tr -d ' ')"

          cat > /tmp/release-notes.md <<EOF
          ## PaperlessAgent ${TAG}

          Built from commit \`${COMMIT_SHORT}\` (\`${COMMIT}\`) — ${FILE_COUNT} tracked files packed into the release archive.

          ### Assets
          - \`paperlessagent-${VERSION}.tar.gz\` — full source archive for the in-app updater (SHA-256 verified)
          - \`install.sh\` — Linux/macOS one-line installer bootstrap
          - \`install.ps1\` — Windows PowerShell one-line installer bootstrap
          - \`SHA256SUMS\` — checksums

          ### Install
          Linux / macOS:
          \`\`\`bash
          curl -fsSL https://github.com/dpastoetter/paperlessagent/releases/latest/download/install.sh | bash
          \`\`\`

          Windows (PowerShell):
          \`\`\`powershell
          irm https://github.com/dpastoetter/paperlessagent/releases/latest/download/install.ps1 | iex
          \`\`\`
          EOF
          # Strip the common leading indent from the heredoc body.
          sed -i 's/^          //' /tmp/release-notes.md

          ASSETS=(dist/paperlessagent-"${VERSION}".tar.gz dist/install.sh dist/install.ps1 dist/SHA256SUMS)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --notes-file /tmp/release-notes.md --target "$COMMIT"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md \
              --target "$COMMIT"
          fi
