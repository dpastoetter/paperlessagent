name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build release assets
        run: |
          chmod +x scripts/make-release-assets.sh
          ./scripts/make-release-assets.sh "${GITHUB_REF_NAME}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          cat > /tmp/release-notes.md <<EOF
          ## PaperlessAgent ${TAG}

          ### Assets
          - \`paperlessagent-${VERSION}.tar.gz\` — source archive for the in-app updater (SHA-256 verified)
          - \`SHA256SUMS\` — checksums

          ### Install
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/dpastoetter/paperlessagent/main/scripts/install.sh | bash
          \`\`\`
          EOF
          # Strip the common leading indent from the heredoc body.
          sed -i 's/^          //' /tmp/release-notes.md

          ASSETS=(dist/paperlessagent-"${VERSION}".tar.gz dist/SHA256SUMS)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md
          fi
