<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepCatalog Studio</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0e1317;
      color: #e8eef2;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
    }
    .mark {
      text-align: center;
      letter-spacing: -0.03em;
    }
    h1 {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 700;
    }
    p {
      margin: 0.45rem 0 0;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      opacity: 0.72;
    }
  </style>
</head>
<body>
  <div class="mark">
    <h1>DeepCatalog</h1>
    <p>Studio</p>
  </div>
</body>
</html>
